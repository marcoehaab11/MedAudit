server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Public assets must exist; never turn a missing asset into a private SPA page.
    location ~* \.(js|css|map|png|jpg|jpeg|svg|ico|webp|avif|woff|woff2|ttf|webmanifest)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
