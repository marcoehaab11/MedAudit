name: dental-clinic

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meddentist}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/DentalClinic.Api/Dockerfile
    environment: &backend-environment
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=meddentist_app;Password=${DATABASE_APP_PASSWORD:?DATABASE_APP_PASSWORD must be set}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      RateLimiting__KeySecret: ${RATE_LIMIT_KEY_SECRET:?RATE_LIMIT_KEY_SECRET must be set}
      RateLimiting__TrustedProxies: 172.30.74.10
      Authentication__Jwt__Issuer: ${JWT_ISSUER:-MedDentist}
      Authentication__Jwt__Audience: ${JWT_AUDIENCE:-MedDentist.Client}
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set}
      Monitoring__ApiReadyUrl: http://api:8080/health/ready
      Monitoring__ClinicAppUrl: http://clinic-app:80/
      Monitoring__BookingAppUrl: http://public-app:80/
      Monitoring__AlertEmail: ${MONITOR_ALERT_EMAIL:-}
      DataProtection__KeyPath: /app/data-protection-keys
      Onboarding__PublicAppUrl: ${PUBLIC_APP_URL:-https://medaudit.online}
      Onboarding__ClinicAppUrl: ${CLINIC_APP_URL:-https://app.medaudit.online}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ENABLE_SSL: ${SMTP_ENABLE_SSL:-true}
    volumes:
      - data-protection-keys:/app/data-protection-keys
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n' >&3 && timeout 2 grep -q 'Healthy' <&3"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  platform-admin:
    build:
      context: .
      dockerfile: src/DentalClinic.PlatformAdmin/Dockerfile
    environment: *backend-environment
    volumes:
      - data-protection-keys:/app/data-protection-keys
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n' >&3 && timeout 2 grep -q 'Healthy' <&3"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/DentalClinic.Worker/Dockerfile
    environment:
      <<: *backend-environment
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=meddentist_jobs;Password=${DATABASE_WORKER_PASSWORD:?DATABASE_WORKER_PASSWORD must be set}
    volumes:
      - data-protection-keys:/app/data-protection-keys
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: src/DentalClinic.Api/Dockerfile
    command: ["--migrate"]
    environment:
      <<: *backend-environment
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DatabaseSecurity__AppPassword: ${DATABASE_APP_PASSWORD:?DATABASE_APP_PASSWORD must be set}
      DatabaseSecurity__WorkerPassword: ${DATABASE_WORKER_PASSWORD:?DATABASE_WORKER_PASSWORD must be set}
    volumes:
      - data-protection-keys:/app/data-protection-keys
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  clinic-app:
    build: frontend/dental-clinic-app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  public-app:
    build: frontend/dental-clinic-public
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  reverse-proxy:
    image: nginx:1.29-alpine
    networks:
      default:
        ipv4_address: 172.30.74.10
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - platform-admin
      - clinic-app
      - public-app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    networks:
      default:
        ipv4_address: 172.30.74.11
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      - reverse-proxy

volumes:
  postgres-data:
  redis-data:
  data-protection-keys:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.74.0/24
