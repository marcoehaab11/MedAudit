resolver 127.0.0.11 valid=10s ipv6=off;

# Only the private tunnel container may supply Cloudflare's client-address header.
set_real_ip_from 172.30.74.11;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

map $remote_addr $real_client_ip {
    default $remote_addr;
}

# Only the private tunnel may report the original HTTPS scheme.
map "$realip_remote_addr:$http_x_forwarded_proto" $forwarded_proto {
    default $scheme;
    "172.30.74.11:https" https;
}

# WebSockets Support
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $real_client_ip zone=api_limit:10m rate=30r/s;
limit_req_zone $real_client_ip zone=static_limit:10m rate=100r/s;
limit_req_status 429;
error_page 429 = @request_limit;


# ── App (Clinic App + API) ──
server {
    location @request_limit {
        internal;
        default_type 'text/html; charset=utf-8';
        add_header Retry-After 1 always;
        return 429 '<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><p>طلبات كثيرة جدًا. انتظر ثانية ثم حاول مرة أخرى.</p><p lang="en" dir="ltr">Too many requests. Please wait one second and try again.</p></html>';
    }

    listen 80;
    server_name app.localhost app.medaudit.online ~^app\.;
    client_max_body_size 25M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control no-store always;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }

    # Replace the retired Angular worker so old browser caches unregister safely.
    location = /ngsw-worker.js {
        limit_req zone=static_limit burst=200 nodelay;
        default_type application/javascript;
        return 200 "self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.registration.unregister().then(()=>self.clients.matchAll()).then(cs=>Promise.all(cs.map(c=>c.navigate(c.url))))));";
    }

    location = /_clinic_session_check {
        internal;
        set $session_upstream http://api:8080;
        proxy_pass $session_upstream/api/auth/page-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location @clinic_login {
        return 302 /login;
    }

    location @clinic_session_unavailable {
        default_type 'text/html; charset=utf-8';
        return 503 '<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><p>التحقق من جلسة الدخول غير متاح مؤقتًا. حاول مرة أخرى بعد قليل.</p></html>';
    }

    location @clinic_forbidden {
        default_type 'text/html; charset=utf-8';
        return 403 '<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><p>ليس لديك صلاحية لعرض هذه الصفحة.</p><p lang="en" dir="ltr">You do not have permission to view this page.</p></html>';
    }

    location ~ ^/(login|forgot-password|reset-password|accept-invitation)/?$ {
        limit_req zone=static_limit burst=200 nodelay;
        set $clinic_upstream http://clinic-app:80;
        proxy_pass $clinic_upstream;
    }

    location ~* \.(js|css|map|png|jpg|jpeg|svg|ico|webp|avif|woff|woff2|ttf|webmanifest)$ {
        limit_req zone=static_limit burst=200 nodelay;
        set $clinic_upstream http://clinic-app:80;
        proxy_pass $clinic_upstream;
    }

    location / {
        auth_request /_clinic_session_check;
        error_page 401 = @clinic_login;
        error_page 403 = @clinic_forbidden;
        error_page 500 = @clinic_session_unavailable;
        error_page 429 = @request_limit;
        limit_req zone=static_limit burst=200 nodelay;
        set $clinic_upstream http://clinic-app:80;
        proxy_pass $clinic_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# ── API Direct ──
server {
    location @request_limit {
        internal;
        default_type 'text/html; charset=utf-8';
        add_header Retry-After 1 always;
        add_header Cache-Control no-store always;
