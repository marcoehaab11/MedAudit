resolver 127.0.0.11 valid=10s ipv6=off;

# Real Client IP from Cloudflare
map $http_cf_connecting_ip $real_client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

# Forwarded Proto from Cloudflare / Client
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# WebSockets Support
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $real_client_ip zone=api_limit:10m rate=30r/s;
limit_req_zone $real_client_ip zone=booking_limit:10m rate=5r/s;

# ── App (Clinic App + API) ──
server {
    listen 80;
    server_name app.localhost app.medaudit.online ~^app\.;
    client_max_body_size 25M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_read_timeout 100s;
    }

    location / {
        set $clinic_upstream http://clinic-app:80;
        proxy_pass $clinic_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# ── API Direct ──
server {
    listen 80;
    server_name api.localhost api.medaudit.online ~^api\.;
    client_max_body_size 25M;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

