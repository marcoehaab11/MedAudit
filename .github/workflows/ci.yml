name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: DentalClinic.slnx
      - name: Verify Code Formatting
        run: dotnet format --verify-no-changes
      - name: Restore
        run: dotnet restore DentalClinic.slnx --configfile NuGet.Config
      - name: Build
        run: dotnet build DentalClinic.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test DentalClinic.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Check vulnerable packages
        run: dotnet list DentalClinic.slnx package --vulnerable --include-transitive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [dental-clinic-app, dental-clinic-public]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
      - run: npm audit --audit-level=high

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: src/DentalClinic.Api/Dockerfile
            context: .
          - image: worker
            dockerfile: src/DentalClinic.Worker/Dockerfile
            context: .
          - image: platform-admin
            dockerfile: src/DentalClinic.PlatformAdmin/Dockerfile
            context: .
          - image: clinic-app
            dockerfile: frontend/dental-clinic-app/Dockerfile
            context: frontend/dental-clinic-app
          - image: public-app
            dockerfile: frontend/dental-clinic-public/Dockerfile
            context: frontend/dental-clinic-public
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file "${{ matrix.dockerfile }}" --tag "dental-clinic/${{ matrix.image }}:${{ github.sha }}" "${{ matrix.context }}"
